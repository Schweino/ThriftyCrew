name: Agent - triage reviewer
on:
  schedule:
    - cron: "57 13 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
permissions: { contents: read, id-token: write, actions: write }
jobs:
  call:
    uses: ./.github/workflows/platform-agent-runner.yml
    with: { agent_id: triage-reviewer, job_name: triage-review }
    secrets: inherit
