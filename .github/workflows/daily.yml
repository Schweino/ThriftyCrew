name: Daily grocery pipeline

# Runs the whole server-side pipeline in the cloud so Brad's PC can stay off:
# pull server ads -> compare -> verify -> recipe overlay -> top5 -> export feed -> publish to Ghost,
# then commits the refreshed data + feed back to the repo (Cloudflare serves public/smp-feed.json).
#
# Windows runner on purpose: the engine is Windows PowerShell 5.1 and spawns child `powershell`
# processes, so we run it in the exact interpreter it was written and tested for (no pwsh porting).

on: { workflow_dispatch: {} }  # retained only as a manually selected rollback/fallback

permissions:
  contents: write              # allow committing the refreshed data back

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    steps:
      # ALREADY RAN (locally or here)? THEN A SCHEDULED RUN IS A DOUBLE-RUN - STAND DOWN *BEFORE* CHECKOUT.
      # The day's work is once-daily by definition. Since 2026-07-23 the LOCAL 8:30am task is the primary
      # runner, so on a normal day this backup finds a fresh bot commit and stops. The check uses the commits
      # API instead of git log precisely so it can run before the (multi-minute, full-history) checkout: a
      # stand-down day now costs ~1 billed minute instead of ~10. A 16-hour window (not "today") is immune to
      # cron drift and timezone math: the local run commits ~13:30-14:30 UTC, hours inside the window; a
      # commit from yesterday's backup (~16:30 UTC) is ~24h old and correctly does NOT stand us down.
      # It only ever stands down for a SUCCESS: a run that failed before committing leaves no commit to find.
      # workflow_dispatch always proceeds - that is the manual override.
      - name: Stand down if the pipeline already ran (API check, pre-checkout)
        id: gate
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'schedule') {
            Write-Host "Manual run (workflow_dispatch) - always proceeds."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $since = (Get-Date).ToUniversalTime().AddHours(-16).ToString("yyyy-MM-ddTHH:mm:ssZ")
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits?author=actions@users.noreply.github.com&since=$since&per_page=1"
          $resp = $null
          try { $resp = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "smp-pipeline" } } catch { Write-Host "gate API check failed ($($_.Exception.Message)) - failing OPEN (running) so an API blip can never stop the pipeline" }
          # >>> GATE-COUNT  (test-gate-count.ps1 extracts and executes THIS text verbatim - keep the sentinels)
          # COUNT THE COMMITS, NOT THE WRAPPER. This was `@(Invoke-RestMethod ...).Count -gt 0`, and in
          # Windows PowerShell 5.1 that is ALWAYS TRUE. Invoke-RestMethod emits a deserialized JSON array as
          # ONE pipeline object rather than enumerating it, so @( ) around the CALL builds a 1-element array
          # holding the array - Count 1 whether the API returned zero commits or fifty. (@( ) around a
          # VARIABLE that already holds the array unrolls it correctly, which is why this reads as fine.)
          # Measured 2026-08-06: every scheduled run from #22 on 2026-07-24 through #34 on 2026-08-05 stood
          # down in 0.1-0.4 min - 13 consecutive days, all green, the backup never once ran. It went unseen
          # because a stand-down is a SUCCESS, so the workflow reported healthy the entire time. On 08-05 and
          # 08-06 the local 8:30 run also stood down (the weekly lock held grocery\out across two days) and
          # there was no safety net underneath it at all. See ps51-json-array-traps.
          # Assign first, then pipe: piping a stored array enumerates it, $null pipes to nothing, and .sha
          # keeps a non-commit payload (an API error object) from counting as a commit.
          $commitCount = @($resp | Where-Object { $_.sha }).Count
          # <<< GATE-COUNT
          if ($commitCount -gt 0) {
            Write-Host "::notice::The pipeline already committed within 16h (the local 8:30am run). Backup standing down - a second pass would only re-throttle the stores and burn runner minutes."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "No bot commit in the last 16h - the local run was missed. Running as backup."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          # 0 = FULL history, on purpose. checkout's default is a depth-1 shallow clone, which is fine until the
          # commit step has to `git rebase` onto a main that has moved - a shallow clone can be missing the merge
          # base, and that rebase is the exact step that killed 2026-07-16. Do not shallow this to save a few
          # seconds on a job that only reaches this step when it is genuinely going to do the day's work.
          fetch-depth: 0

      # CREDENTIALS. Key files (.ghostkey, .krogerkey) are gitignored, so on a runner they do not exist and
      # every consumer must fall back to an env var. Until 2026-08-08 only GHOST_ADMIN_KEY was passed, so
      # Baker's pull (Kroger's sanctioned API) could never authenticate here - it would throw, the board
      # would lose a store, and nobody would learn that until the backup actually fired for the first time.
      # grocery\audit-cloud-readiness.ps1 is the standing check that no chain script can ONLY read a file.
      - name: Run the daily pipeline
        if: steps.gate.outputs.skip != 'true'
        env:
          GHOST_ADMIN_KEY:      ${{ secrets.GHOST_ADMIN_KEY }}
          KROGER_CLIENT_ID:     ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
        shell: powershell
        run: |
          # fail fast and LOUDLY on a missing secret, rather than discovering it as a mangled store pull
          # three quarters of the way through a 39-minute run
          foreach ($k in 'GHOST_ADMIN_KEY','KROGER_CLIENT_ID','KROGER_CLIENT_SECRET') {
            if (-not (Get-Item "Env:$k" -ErrorAction SilentlyContinue).Value) {
              Write-Host "::warning::secret $k is not set - the part of the pipeline that needs it will degrade (see grocery/audit-cloud-readiness.ps1)"
            }
          }
          powershell -ExecutionPolicy Bypass -File grocery/audit-cloud-readiness.ps1
          powershell -ExecutionPolicy Bypass -File grocery/check-ad-cycles.ps1 -NoAlert
          Write-Host "--- ad-cycle log tail ---"
          if (Test-Path grocery/ad-cycle-log.txt) { Get-Content grocery/ad-cycle-log.txt -Tail 25 }

      # COMMIT BEFORE ASSERTING, AND ALWAYS.
      # This used to run AFTER the freshness assert with no `if: always()`, so a failed assert exited the job and
      # committed NOTHING - not the data, not even the ad-cycle log, leaving no evidence to diagnose from.
      # (2026-07-17 correction: I first assumed that ordering was what ate 2026-07-16. The run log says
      # otherwise - the real killer was the rebase conflict handled below. The ordering was a second, real hole
      # that would have hidden the next failure just as well; both are fixed. Record what the log says, not what
      # the theory says.)
      # Committing first costs nothing (guards.ps1 already decides what may be PUBLISHED; this only records what
      # happened). The assert still fails the job afterwards, so GitHub still emails - it just no longer
      # destroys the evidence on its way out.
      # THE COMMIT MUST SURVIVE A BUSY main. THIS IS WHAT KILLED 2026-07-16.
      # The run did all 28 minutes of work, published, and committed - then `git pull --rebase` hit an add/add
      # conflict (Brad pushes to main during the day; the pipeline rewrites the same derived files), the rebase
      # stopped mid-flight leaving DETACHED HEAD, `git push` said "You are not currently on a branch", exit 1,
      # and the entire run's output was thrown away. The pipeline never failed. The COMMIT failed, and it took
      # a day of prices with it. A bot that cannot survive a conflict on a repo a human works in is not
      # automated, it is a coin flip.
      #
      #  * -X theirs during a rebase = prefer the commit being REPLAYED (the pipeline's fresh output) over
      #    upstream. Correct for these files by construction: every one is DERIVED and the pipeline just
      #    regenerated it from today's sources, so its copy is strictly newer than whatever main holds. It only
      #    ever touches its own outputs, so it cannot clobber hand-written code.
      #  * `git rebase --abort` on failure so we NEVER exit in detached HEAD. That state is what turned a
      #    recoverable conflict into a dead job.
      #  * Retry: main can move again between fetch and push (that is the race that caused this).
      #  * `HEAD:main` pushes correctly even if we somehow end up detached.
      - name: Commit refreshed prices + feed
        if: always() && steps.gate.outputs.skip != 'true'
        shell: powershell
        run: |
          git config user.name  "smp-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes to commit."; exit 0 }
          git commit -m "Daily pipeline: refresh prices + feed ($(Get-Date -Format 'yyyy-MM-dd'))"
          $pushed = $false
          foreach ($attempt in 1..4) {
            Write-Host "--- commit/push attempt $attempt ---"
            git fetch origin main
            git rebase -X theirs origin/main
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "rebase attempt $attempt hit a conflict -X theirs could not settle; aborting so we do not end up detached"
              git rebase --abort
              Start-Sleep -Seconds 10
              continue
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; Write-Host "pushed on attempt $attempt"; break }
            Write-Warning "push rejected (main moved under us); retrying"
            Start-Sleep -Seconds 10
          }
          if (-not $pushed) {
            git rebase --abort 2>$null
            git status --short | Select-Object -First 20
            Write-Error "Could not commit the pipeline's output to main after 4 attempts. The run's data is NOT saved - the feed will be stale. This is the failure that silently ate 2026-07-16."
            exit 1
          }

      # Skipped by the gate too: a stood-down run committed nothing, so asserting "the feed changed today" would
      # fail a run that did exactly what it was told. The gate only stands down when the feed is ALREADY fresh.
      - name: Assert the feed refreshed today (fails -> GitHub emails you)
        if: always() && steps.gate.outputs.skip != 'true'
        shell: powershell
        run: |
          $today = (Get-Date).ToString('yyyy-MM-dd')
          $feed  = Get-Content public/smp-feed.json -Raw | ConvertFrom-Json
          $gen   = ([datetime]$feed.generated).ToString('yyyy-MM-dd')
          if ($gen -ne $today) {
            Write-Error "Pipeline did NOT refresh the feed today (feed generated $gen, expected $today). A store pull likely failed from the cloud IP; nothing bad was published. The run's data + log ARE committed - check grocery/ad-cycle-log.txt for how far it got."
            exit 1
          }
          Write-Host "OK: feed fresh - week $($feed.week_of), $($feed.recipe_count) recipes, $($feed.ingredient_count) ingredients."

      # 2026-07-23: on ANY step failure, relay a real Gmail alert through the smp-feed Worker's /ops-alert.
      # This runner holds no Google token - it proves itself with the SHA-256 of GHOST_ADMIN_KEY (the same
      # scheme the pipeline's /notify calls use; the key itself never travels). GitHub's own failure email
      # still fires too; this just makes cloud failures land in the same inbox as every other alert.
      # Non-fatal by construction: an alerting hiccup must never turn a data failure into a masked one.
      - name: Relay failure to Gmail via the Worker
        if: failure() && steps.gate.outputs.skip != 'true'
        shell: powershell
        env:
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
        run: |
          try {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            $hash = ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($env:GHOST_ADMIN_KEY)) | ForEach-Object { $_.ToString('x2') }) -join ''
            $body = @{ subject = "Grocery CLOUD BACKUP run failed - $(Get-Date -Format 'yyyy-MM-dd')"; body = "The 16:00 UTC cloud backup pipeline run failed (the local 8:30am run must have been missed too, or this was a manual run). Nothing bad was published - the guards fail closed and the board holds its last good state. Check the Actions tab for 'Daily grocery pipeline' and grocery/ad-cycle-log.txt in the repo for how far it got." } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://feed.thriftycrew.com/ops-alert" -Method Post -ContentType "application/json" -Headers @{ "X-Notify-Auth" = $hash } -Body $body | Out-Null
            Write-Host "failure relayed to Gmail via the Worker"
          } catch { Write-Host "ops-alert relay failed ($($_.Exception.Message)) - GitHub's own failure email still covers this" }
