name: Daily grocery pipeline

# Runs the whole server-side pipeline in the cloud so Brad's PC can stay off:
# pull server ads -> compare -> verify -> recipe overlay -> top5 -> export feed -> publish to Ghost,
# then commits the refreshed data + feed back to the repo (Cloudflare serves public/smp-feed.json).
#
# Windows runner on purpose: the engine is Windows PowerShell 5.1 and spawns child `powershell`
# processes, so we run it in the exact interpreter it was written and tested for (no pwsh porting).

on:
  schedule:
    - cron: '30 11 * * *'     # 11:30 UTC = 06:30 America/Chicago (CDT). Runs AFTER the ~6:00 local browser
                              # agents push their fresh Baker's/Sam's/Walmart data, so the cloud recomputes
                              # with current prices. GitHub cron ignores DST -> 05:30 Central in winter, fine.
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: write              # allow committing the refreshed data back

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = FULL history, on purpose. checkout's default is a depth-1 shallow clone, which is fine until the
          # commit step has to `git rebase` onto a main that has moved - a shallow clone can be missing the merge
          # base, and that rebase is the exact step that killed 2026-07-16. It also lets the gate below actually
          # find the bot's last commit. Do not shallow this to save a few seconds on a job that runs for 25 min.
          fetch-depth: 0

      # ALREADY DONE TODAY? THEN A SCHEDULED RUN IS A DOUBLE-RUN.
      # The day's work is once-daily by definition, so if smp-pipeline-bot has already committed today the
      # schedule has nothing to add - it would just re-pull every store (Freshop throttles HARD on a second
      # pass; its wipeout guard then refuses the partial and the run achieves exactly nothing) and burn another
      # ~25 windows-runner minutes at 2x billing.
      # This is what makes MANUAL TESTING SAFE: trigger a run whenever you like, and the schedule stands down
      # for the rest of that day on its own. No "disable the workflow and remember to re-enable it" - a
      # disabled workflow nobody switches back on is a worse outage than the bug it was hiding.
      # It only ever stands down for a SUCCESS: if the manual run failed to commit, there is no commit to find,
      # and the schedule runs normally. workflow_dispatch always runs - that is the override.
      - name: Skip if the pipeline already committed today
        id: gate
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'schedule') {
            Write-Host "Manual run (workflow_dispatch) - always proceeds."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $today = (Get-Date -Format 'yyyy-MM-dd')
          $last  = (git log --author="smp-pipeline-bot" -1 --format=%cd --date=format:'%Y-%m-%d' 2>$null)
          Write-Host "today=$today  last smp-pipeline-bot commit=$last"
          if ($last -eq $today) {
            Write-Host "::notice::The pipeline already committed today ($last). Scheduled run standing down - a second pass would only re-throttle the stores and burn runner minutes."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Run the daily pipeline
        if: steps.gate.outputs.skip != 'true'
        env:
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File grocery/check-ad-cycles.ps1 -NoAlert
          Write-Host "--- ad-cycle log tail ---"
          if (Test-Path grocery/ad-cycle-log.txt) { Get-Content grocery/ad-cycle-log.txt -Tail 25 }

      # COMMIT BEFORE ASSERTING, AND ALWAYS.
      # This used to run AFTER the freshness assert with no `if: always()`, so a failed assert exited the job and
      # committed NOTHING - not the data, not even the ad-cycle log, leaving no evidence to diagnose from.
      # (2026-07-17 correction: I first assumed that ordering was what ate 2026-07-16. The run log says
      # otherwise - the real killer was the rebase conflict handled below. The ordering was a second, real hole
      # that would have hidden the next failure just as well; both are fixed. Record what the log says, not what
      # the theory says.)
      # Committing first costs nothing (guards.ps1 already decides what may be PUBLISHED; this only records what
      # happened). The assert still fails the job afterwards, so GitHub still emails - it just no longer
      # destroys the evidence on its way out.
      # THE COMMIT MUST SURVIVE A BUSY main. THIS IS WHAT KILLED 2026-07-16.
      # The run did all 28 minutes of work, published, and committed - then `git pull --rebase` hit an add/add
      # conflict (Brad pushes to main during the day; the pipeline rewrites the same derived files), the rebase
      # stopped mid-flight leaving DETACHED HEAD, `git push` said "You are not currently on a branch", exit 1,
      # and the entire run's output was thrown away. The pipeline never failed. The COMMIT failed, and it took
      # a day of prices with it. A bot that cannot survive a conflict on a repo a human works in is not
      # automated, it is a coin flip.
      #
      #  * -X theirs during a rebase = prefer the commit being REPLAYED (the pipeline's fresh output) over
      #    upstream. Correct for these files by construction: every one is DERIVED and the pipeline just
      #    regenerated it from today's sources, so its copy is strictly newer than whatever main holds. It only
      #    ever touches its own outputs, so it cannot clobber hand-written code.
      #  * `git rebase --abort` on failure so we NEVER exit in detached HEAD. That state is what turned a
      #    recoverable conflict into a dead job.
      #  * Retry: main can move again between fetch and push (that is the race that caused this).
      #  * `HEAD:main` pushes correctly even if we somehow end up detached.
      - name: Commit refreshed prices + feed
        if: always() && steps.gate.outputs.skip != 'true'
        shell: powershell
        run: |
          git config user.name  "smp-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes to commit."; exit 0 }
          git commit -m "Daily pipeline: refresh prices + feed ($(Get-Date -Format 'yyyy-MM-dd'))"
          $pushed = $false
          foreach ($attempt in 1..4) {
            Write-Host "--- commit/push attempt $attempt ---"
            git fetch origin main
            git rebase -X theirs origin/main
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "rebase attempt $attempt hit a conflict -X theirs could not settle; aborting so we do not end up detached"
              git rebase --abort
              Start-Sleep -Seconds 10
              continue
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; Write-Host "pushed on attempt $attempt"; break }
            Write-Warning "push rejected (main moved under us); retrying"
            Start-Sleep -Seconds 10
          }
          if (-not $pushed) {
            git rebase --abort 2>$null
            git status --short | Select-Object -First 20
            Write-Error "Could not commit the pipeline's output to main after 4 attempts. The run's data is NOT saved - the feed will be stale. This is the failure that silently ate 2026-07-16."
            exit 1
          }

      # Skipped by the gate too: a stood-down run committed nothing, so asserting "the feed changed today" would
      # fail a run that did exactly what it was told. The gate only stands down when the feed is ALREADY fresh.
      - name: Assert the feed refreshed today (fails -> GitHub emails you)
        if: always() && steps.gate.outputs.skip != 'true'
        shell: powershell
        run: |
          $today = (Get-Date).ToString('yyyy-MM-dd')
          $feed  = Get-Content public/smp-feed.json -Raw | ConvertFrom-Json
          $gen   = ([datetime]$feed.generated).ToString('yyyy-MM-dd')
          if ($gen -ne $today) {
            Write-Error "Pipeline did NOT refresh the feed today (feed generated $gen, expected $today). A store pull likely failed from the cloud IP; nothing bad was published. The run's data + log ARE committed - check grocery/ad-cycle-log.txt for how far it got."
            exit 1
          }
          Write-Host "OK: feed fresh - week $($feed.week_of), $($feed.recipe_count) recipes, $($feed.ingredient_count) ingredients."
