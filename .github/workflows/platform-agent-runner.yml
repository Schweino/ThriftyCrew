name: Registered grocery agent runner

on:
  workflow_call:
    inputs:
      agent_id:
        required: true
        type: string
      job_name:
        required: false
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        required: true
      TC_AGENT_APP_ID:
        required: false
      TC_AGENT_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: platform
    env:
      TC_AGENT_ID: ${{ inputs.agent_id }}
      TC_JOB_NAME: ${{ inputs.job_name }}
      TC_API_ORIGIN: ${{ vars.TC_V3_API_ORIGIN }}
      TC_OIDC_AUDIENCE: tc-grocery-v3
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Initialize bounded output directory
        run: |
          echo "TC_OUTPUT_ROOT=$RUNNER_TEMP/tc-agent-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tc-agent-output"

      - name: Verify registry and deterministic evaluation corpus
        run: |
          pnpm agents:check
          pnpm --filter @thriftycrew/agents eval:fixtures "$TC_AGENT_ID"

      - name: Resolve registered execution metadata
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('config/agents.json', 'utf8'));
          const agent = registry.agents.find((entry) => entry.id === process.env.TC_AGENT_ID);
          if (!agent || !agent.enabled) throw new Error('registered agent is missing or disabled');
          console.log(`TC_AGENT_PROMPT_HASH=${agent.promptSha256}`);
          console.log(`TC_AGENT_MODEL=${agent.model}`);
          console.log(`TC_AGENT_ESTIMATED_COST_MICROUSD=${Math.min(agent.monthlyBudgetMicrousd, 500000)}`);
          NODE

      - name: Check exact execution evaluation
        id: evaluation-status
        run: |
          pnpm tc agent evaluation-status "$TC_AGENT_ID" "$TC_OUTPUT_ROOT/evaluation-status.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(process.env.TC_OUTPUT_ROOT + '/evaluation-status.json', 'utf8'));
          console.log(`current=${status.current ? 'true' : 'false'}`);
          NODE

      - name: Evaluate exact execution configuration
        if: steps.evaluation-status.outputs.current != 'true'
        run: |
          mkdir -p "$TC_OUTPUT_ROOT"
          pnpm --filter @thriftycrew/agents eval "$TC_AGENT_ID"
          pnpm tc agent evaluation "$TC_OUTPUT_ROOT/${TC_AGENT_ID}-evaluation.json"

      - name: Claim one fenced work item
        id: claim
        run: |
          pnpm tc agent claim "$TC_AGENT_ID" "$TC_OUTPUT_ROOT/claim.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const claim = JSON.parse(fs.readFileSync(process.env.TC_OUTPUT_ROOT + '/claim.json', 'utf8'));
          console.log(`claimed=${claim.item ? 'true' : 'false'}`);
          if (claim.item) {
            fs.writeFileSync(process.env.TC_OUTPUT_ROOT + '/input.json', JSON.stringify(claim.item.input));
            fs.appendFileSync(process.env.GITHUB_ENV, `TC_AGENT_WORK_ITEM_ID=${claim.item.id}\n`);
          }
          NODE

      - name: Authorize model and budget class
        if: steps.claim.outputs.claimed == 'true'
        run: |
          pnpm tc agent authorize "$TC_AGENT_ID" "$TC_OUTPUT_ROOT/claim.json" 500000 "$TC_OUTPUT_ROOT/authorization.json"
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import fs from 'node:fs';
          const authorization = JSON.parse(fs.readFileSync(process.env.TC_OUTPUT_ROOT + '/authorization.json', 'utf8'));
          if (!authorization.allowed || !authorization.modelId) throw new Error('agent execution was not authorized');
          console.log(`TC_AGENT_MODEL=${authorization.modelId}`);
          NODE

      - name: Start scheduled ledger
        if: steps.claim.outputs.claimed == 'true' && inputs.job_name != ''
        run: pnpm tc job start "$TC_JOB_NAME"

      - name: Execute registered agent
        id: execute
        if: steps.claim.outputs.claimed == 'true'
        env:
          TC_AGENT_INPUT_FILE: ${{ runner.temp }}/tc-agent-output/input.json
        run: pnpm --filter @thriftycrew/agents run run -- "$TC_AGENT_ID"

      - name: Stage bounded PR proposal
        id: proposal
        if: steps.claim.outputs.claimed == 'true' && steps.execute.outcome == 'success' && (inputs.agent_id == 'triage-developer' || inputs.agent_id == 'source-sentinel-investigator')
        working-directory: .
        run: node platform/scripts/stage-agent-pr.mjs "$TC_AGENT_ID" "$TC_OUTPUT_ROOT/${TC_AGENT_ID}.json"

      - name: Require GitHub App credentials for PR agents
        if: steps.proposal.outcome == 'success' && steps.proposal.outputs.requires_operator != 'true'
        env:
          APP_ID: ${{ secrets.TC_AGENT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.TC_AGENT_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" && test -n "$PRIVATE_KEY" || { echo "::error::PR agents require the bounded GitHub App credentials"; exit 1; }

      - name: Mint bounded GitHub App token
        id: app-token
        if: steps.proposal.outcome == 'success' && steps.proposal.outputs.requires_operator != 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TC_AGENT_APP_ID }}
          private-key: ${{ secrets.TC_AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify proposed changes through all gates
        if: steps.proposal.outcome == 'success' && steps.proposal.outputs.requires_operator != 'true'
        run: pnpm check

      - name: Open PR without deployment authority
        id: open-pr
        if: steps.proposal.outcome == 'success' && steps.proposal.outputs.requires_operator != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.proposal.outputs.branch }}
          title: ${{ steps.proposal.outputs.title }}
          body: "Generated by a registered Thrifty Crew agent. Deterministic repository gates passed; deployment remains outside this workflow."
          commit-message: ${{ steps.proposal.outputs.title }}

      - name: Complete fenced work item
        id: complete
        if: steps.claim.outputs.claimed == 'true' && steps.execute.outcome == 'success' && ((inputs.agent_id != 'triage-developer' && inputs.agent_id != 'source-sentinel-investigator') || steps.proposal.outputs.requires_operator == 'true' || steps.open-pr.outcome == 'success')
        run: |
          set -o pipefail
          pnpm tc agent complete "$TC_OUTPUT_ROOT/claim.json" "$TC_OUTPUT_ROOT/${TC_AGENT_ID}.json" | tee "$TC_OUTPUT_ROOT/completion.log"

      - name: Fail fenced work item
        if: always() && steps.claim.outputs.claimed == 'true' && steps.complete.outcome != 'success'
        run: pnpm tc agent fail "$TC_OUTPUT_ROOT/claim.json" "registered agent workflow failed"

      - name: Finish scheduled ledger
        if: always() && steps.claim.outputs.claimed == 'true' && inputs.job_name != ''
        env:
          TC_GITHUB_JOB_STATUS: ${{ job.status }}
        run: |
          usage_file="$TC_OUTPUT_ROOT/${TC_AGENT_ID}-usage.json"
          export TC_AGENT_USAGE_JSON="$(test -f "$usage_file" && cat "$usage_file" || echo '{"inputTokens":0,"outputTokens":0,"cacheReadTokens":0,"cacheWriteTokens":0,"costMicrousd":0}')"
          pnpm tc job finish "$TC_JOB_NAME" "$TC_GITHUB_JOB_STATUS"

      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ inputs.agent_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tc-agent-output/*.json
          if-no-files-found: ignore
          retention-days: 14
