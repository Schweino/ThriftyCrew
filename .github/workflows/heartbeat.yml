name: Pipeline heartbeat

# WHY THIS EXISTS. On 2026-07-16 the daily pipeline simply did not run. It had committed every day from 07-08
# to 07-15, then nothing - and because a failure inside daily.yml exited before its commit step, a dead run and
# a never-scheduled run looked identical from the repo: no log, no data, no clue. Nobody noticed until it was
# asked about directly.
#
# A job that fails loudly is fine. A job that silently STOPS is the dangerous one, because the site keeps
# serving yesterday's prices as though they were today's and nothing anywhere says otherwise.
#
# So: an independent workflow whose only job is to notice that the pipeline's last commit is too old. It does
# NOT depend on the pipeline, so it still fires when the pipeline is the thing that is broken. Deliberately a
# SEPARATE workflow - a heartbeat living inside the job it watches cannot report that job's absence.

on:
  schedule:
    - cron: '0 15 * * *'      # 15:00 UTC = 10:00 Central - 3.5h after the daily's 11:30 UTC slot, so a merely
                              # late GitHub cron (they routinely drift ~1h under load) does not cry wolf.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 2026-07-23: API instead of checkout. The old version cloned 50 commits and searched them for the
      # bot - which (a) paid for a checkout every day and (b) went blind (false alarm) whenever 50+ human
      # commits landed between bot commits, which a busy day can produce. The commits API filters by author
      # server-side with no clone at all: cheaper AND immune to commit volume. The 36h threshold is
      # unchanged: a full missed day plus cron-drift slack; two clean days in a row can never trip it.
      # Since the 2026-07-23 local-primary flip the bot commit normally comes from Brad's PC (~13:30-14:30
      # UTC) with the 16:00 UTC cloud run as backup - this heartbeat is deliberately indifferent to WHICH
      # runner committed; it only cares that SOMEONE did.
      - name: Has the pipeline committed recently?
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          RESP=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: smp-heartbeat" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits?author=actions@users.noreply.github.com&since=$SINCE&per_page=1") || {
            echo "::error::Heartbeat could not reach the commits API - cannot confirm the pipeline is alive. Check Actions + the repo manually."
            exit 1
          }
          COUNT=$(echo "$RESP" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::The daily grocery pipeline has not committed in 36h. Neither the local 8:30am run nor the 16:00 UTC cloud backup is committing. The live board and smp-feed.json are serving stale prices. Check the local task log (grocery/local-daily-log.txt on the PC) and the Actions tab for 'Daily grocery pipeline'."
            exit 1
          fi
          echo "OK: pipeline is alive (a bot commit exists within the last 36h)."
