<!-- Navy app chrome. ONE value for every scheme on purpose: this site is light-only by design
     (elite-layer decision 6), and a second dark-scheme theme-color is how "light only" quietly
     becomes "light except the address bar". -->
<meta name="theme-color" content="#16263F">
<meta name="apple-mobile-web-app-title" content="Thrifty Crew">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="https://smp-feed.ancient-snow-93df.workers.dev/tc-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://smp-feed.ancient-snow-93df.workers.dev/tc-touch-icon-512.png">

<style>
/* LIGHT ONLY, ON THE RECORD. Declared once, here, so no future change can helpfully add a dark
   variant to one surface and leave the other six on warm paper. The receipts, the ledger and the
   chalkboard are all built on light; a half-dark site reads as broken, not as a preference. */
:root{color-scheme:light}

/* The gold focus ring, site-wide, keyboard only. Every builder ships this for its own markup; this
   line covers the Ghost theme's own chrome (nav, portal triggers, footer links) so tabbing through
   the site never loses the caret on a page we did not generate. */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #E2A43C;outline-offset:2px;border-radius:4px}

/* Touch ergonomics on theme chrome we do not render: 16px inputs (below that, iOS zooms the whole
   page on focus, which reads as the site jumping away from the reader). */
input,select,textarea{font-size:16px}
</style>
