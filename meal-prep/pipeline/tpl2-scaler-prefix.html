    // width (measured: 284px) and every row wrapped: 8,859px of content, about EIGHT pages of a two-page
    // card. Same content at 820px is 1,823px. Off-screen keeps it invisible without lying about the width.
    f.setAttribute('aria-hidden','true');
    f.style.cssText='position:fixed;left:-10000px;top:0;width:820px;height:1160px;border:0;opacity:0;pointer-events:none';
    document.body.appendChild(f);
    var d=f.contentWindow.document; d.open(); d.write(doc); d.close();
    f.contentWindow.focus();
    setTimeout(function(){
      try{ f.contentWindow.print(); }catch(e){}
      setTimeout(function(){
        try{ f.parentNode.removeChild(f); }catch(e){}
        try{ if(back&&back.focus&&document.contains(back)){ back.focus({preventScroll:true}); } }catch(e){}
      },2000);
    },350);
  }
  function openShop(){
    if(document.querySelector('.smp-stov')) return;
    var nn=nServ(), items=basket(), stores=storeUniverse(items);
    var sel={};
    stores.forEach(function(s){ sel[s]=true; });
    var ov=document.createElement('div');
    ov.className='smp-stov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Choose your stores');
    var rows='';
    // "cheapest on N" counted with the SAME rule the receipt prices with. It used to count the per-unit
    // winner (e.store), so the picker credited Sam's Club for items the receipt above it was buying at
    // Aldi. Computed once here rather than per store row.
    var winner={};
    items.forEach(function(it,ix){ var w=cheapestAcross(it,nn,null); if(w&&w.store) winner[ix]=w.store; });
    stores.forEach(function(s){
      var carries=0, wins=0;
      items.forEach(function(it,ix){ var e=feedOf(it); if(e&&e.stores&&it.gpu>0&&e.stores[s]>0){ carries++; if(winner[ix]===s) wins++; } });
      rows+='<label class="smp-strow on"><input type="checkbox" data-s="'+esc(s)+'" checked><span class="smp-stnm"><i style="background:'+storeHue(s)+'"></i>'+esc(s)+'</span><span class="smp-stct">carries '+carries+' of '+items.length+(wins?('<br>cheapest on '+wins):'')+'</span></label>';
    });
    var lead=(!items.length)
      ? 'Every ingredient above is unticked, so there is nothing to buy. Tick something back on in Customized pricing and the list fills in. You can still print the recipe.'
      : (stores.length
        ? 'Tick the stores you will actually walk into. Every ingredient gets priced at the cheapest of those, and the list prints split by store.'
        : 'We have no verified store prices for this batch right now, so the list marks prices unavailable.');
    ov.innerHTML='<div class="smp-stsheet"><div class="smp-sthd"><b>Where are you shopping?</b><button type="button" class="smp-stx" aria-label="Close">Close</button></div>'
      +'<div class="smp-stbody"><p class="smp-stsub">'+lead+'</p>'+rows+'<p class="smp-stsum"></p>'
      +'<p class="smp-stnote">Prices are this week&rsquo;s verified shelf prices in Omaha, for whole packages, before tax. Estimates, not quotes.</p></div>'
      +'<div class="smp-stft"><button type="button" class="smp-stprint">Print shopping list and recipe instructions</button></div></div>';
    document.body.appendChild(ov);
    function draw(){
      if(!items.length){ ov.querySelector('.smp-stsum').innerHTML='Nothing to buy right now. The printout will still carry the ingredients and the method.'; return; }
      var r=groupBasket(items,nn,sel), used=0, miss=[];
      r.order.forEach(function(k){ if(k==='|any'){ miss=r.groups[k]; } else { used++; } });
      var un=miss.length;
      var txt='Your list: <b>'+(r.complete?money(r.total):'price unavailable')+'</b> for '+items.length+' item'+(items.length===1?'':'s')+(used?(' across '+used+' store'+(used===1?'':'s')):'')+'.';
      if(un){
        // NAME them. "1 item is not carried" tells the reader nothing they can act on; the item and the
        // store that has it turns it into a decision - tick one more store, or accept the everyday price.
        txt+=' '+un+' item'+(un===1?'':'s')+' below '+(un===1?'is':'are')+' not priced at those stores, so '+(un===1?'it is':'they are')+' marked unavailable:';
        txt+='<ul class="smp-stmiss">';
        miss.slice(0,8).forEach(function(m){
          txt+='<li>'+esc(m.name)+' <span>'+(m.at&&m.at.length?('at '+esc(nameList(m.at))):'no store price tracked yet')+'</span></li>';
        });
        if(un>8){ txt+='<li><span>and '+(un-8)+' more</span></li>'; }
        txt+='</ul>';
      }
      ov.querySelector('.smp-stsum').innerHTML=txt;
    }
    function close(){
      try{ document.body.removeChild(ov); }catch(e){}
      modeFlag(false); untrap();
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    }
    ov.querySelectorAll('.smp-strow input').forEach(function(cb){
      cb.addEventListener('change',function(){
        var s=cb.getAttribute('data-s');
        if(cb.checked){ sel[s]=true; } else { delete sel[s]; }
        var row=cb.closest('label'); if(row){ row.classList.toggle('on',cb.checked); }
        tap(8); draw();
      });
    });
    ov.addEventListener('click',function(e){ if(e.target===ov) close(); });
    ov.querySelector('.smp-stx').addEventListener('click',close);
    ov.querySelector('.smp-stprint').addEventListener('click',function(){ printList(items,nServ(),sel); });
    modeFlag(true);
    var untrap=(window.TC&&window.TC.trap)?window.TC.trap(ov,close):function(){};
    try{ history.pushState({tcShop:1},'',location.pathname+location.search+'#shop'); }catch(e){}
    window.addEventListener('popstate',function h(){ window.removeEventListener('popstate',h); if(document.body.contains(ov)) close(); });
    draw();
  }
  var shop=document.querySelector('.smp-shop');
  if(shop){ shop.addEventListener('click',function(e){ e.preventDefault(); openShop(); }); }
}
// ---------- COOK MODE: built at tap time from the Make It list, so it costs zero nodes until asked ----------
function cookMode(){
  var ol=document.querySelector('.smp-mi'); if(!ol) return;
  var steps=[].slice.call(ol.querySelectorAll('li')).map(function(li){ return li.innerHTML; });
  if(!steps.length) return;
  var slug=(location.pathname||'').replace(/\//g,'')||'recipe';
  var i=parseInt(lsGet('tc-cook-'+slug)||'0',10); if(isNaN(i)||i<0||i>=steps.length) i=0;
  var wrap=document.createElement('div'); wrap.className='smp-cook'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true');
  var title=(document.querySelector('h1')||{}).textContent||'Cook mode';
  wrap.innerHTML='<div class="smp-cook-hd"><b></b><button type="button" class="smp-cook-x" aria-label="Close cook mode">Done</button></div>'
    +'<div class="smp-cook-bar"><i style="width:0%"></i></div>'
    +'<div class="smp-cook-body"><span class="smp-cook-n"></span><p class="smp-cook-t"></p></div>'
    +'<div class="smp-cook-ft"><button type="button" class="smp-cook-ing">Ingredients</button><button type="button" class="smp-cook-back">Back</button><button type="button" class="smp-cook-next">Next step</button></div>';
  wrap.querySelector('.smp-cook-hd b').textContent=title;
  document.body.appendChild(wrap);
  modeFlag(true); wake(true);
  var untrap=(window.TC&&window.TC.trap)?window.TC.trap(wrap,close):function(){};
  function draw(){
    wrap.querySelector('.smp-cook-n').textContent='Step '+(i+1)+' of '+steps.length;
    wrap.querySelector('.smp-cook-t').innerHTML=steps[i];
    wrap.querySelector('.smp-cook-bar i').style.width=Math.round(((i+1)/steps.length)*100)+'%';
    lsSet('tc-cook-'+slug,String(i));
    var body=wrap.querySelector('.smp-cook-body');
    if(!rm()){ body.style.animation='none'; void body.offsetWidth; body.style.animation=''; }
  }
  function go(d){ var n=i+d; if(n<0)n=0; if(n>=steps.length){ close(); return; } i=n; tap(8); draw(); }
  function close(){
    try{ document.body.removeChild(wrap); }catch(e){}
    var sh=document.querySelector('.smp-cook-sheet'); if(sh){ try{ document.body.removeChild(sh); }catch(e){} }
    modeFlag(false); wake(false); untrap();
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    markInline();
  }
  // Tap the right two thirds to advance, the left third to go back. No swipe handlers: they fight scroll,
  // and a step that scrolls is more common than a step that fits.
  wrap.querySelector('.smp-cook-body').addEventListener('click',function(e){
    var r=this.getBoundingClientRect();
    go((e.clientX-r.left) < r.width/3 ? -1 : 1);
  });
  wrap.querySelector('.smp-cook-next').addEventListener('click',function(){ go(1); });
  wrap.querySelector('.smp-cook-back').addEventListener('click',function(){ go(-1); });
  wrap.querySelector('.smp-cook-x').addEventListener('click',close);
  wrap.querySelector('.smp-cook-ing').addEventListener('click',function(){
    var old=document.querySelector('.smp-cook-sheet'); if(old){ document.body.removeChild(old); return; }
    var ul=document.querySelector('.smp-ing'); if(!ul) return;
    var sh=document.createElement('div'); sh.className='smp-cook-sheet';
    sh.innerHTML='<h4>Ingredients, at your servings</h4><ul>'+[].slice.call(ul.querySelectorAll('li')).map(function(li){ return '<li>'+li.innerHTML+'</li>'; }).join('')+'</ul>';
    document.body.appendChild(sh);
    sh.addEventListener('click',function(){ try{ document.body.removeChild(sh); }catch(e){} });
  });
  // hardware back closes the mode instead of leaving the page
  try{ history.pushState({tcCook:1},'',location.pathname+location.search+'#cook'); }catch(e){}
  window.addEventListener('popstate',function h(){ window.removeEventListener('popstate',h); if(document.body.contains(wrap)) close(); });
  draw();
}
// Inline fallback: the same progress, in the ordinary page, for anyone who never opens Cook Mode.
function markInline(){
  var ol=document.querySelector('.smp-mi'); if(!ol) return;
  var slug=(location.pathname||'').replace(/\//g,'')||'recipe';
  var i=parseInt(lsGet('tc-cook-'+slug)||'-1',10);
  var lis=ol.querySelectorAll('li');
  lis.forEach(function(li,n){ li.classList.toggle('smp-done', i>0 && n<i); });
  var res=document.querySelector('.smp-mi-resume');
  if(res){ if(i>0&&i<lis.length){ res.textContent='Picking up at step '+(i+1)+'.'; res.hidden=false; } else { res.hidden=true; } }
}
function go(){
  document.querySelectorAll('.smp-sc').forEach(init);
  var cook=document.querySelector('.smp-jump-cook');
  if(cook){ cook.addEventListener('click',function(e){ e.preventDefault(); cookMode(); }); }
  var ol=document.querySelector('.smp-mi');
  if(ol){
    ol.addEventListener('click',function(e){
      var li=e.target.closest('li'); if(!li||li.parentNode!==ol) return;
      var idx=[].slice.call(ol.children).indexOf(li);
      var slug=(location.pathname||'').replace(/\//g,'')||'recipe';
      var cur=parseInt(lsGet('tc-cook-'+slug)||'0',10);
      lsSet('tc-cook-'+slug,String(cur===idx+1?idx:idx+1));
      tap(8); markInline();
    });
  }
  markInline();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',go); } else { go(); }
})();
