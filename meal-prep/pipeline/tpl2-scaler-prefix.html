<!--SMP-SCALER2--><style>.smp-sc{margin:1.6rem 0 2.4rem;padding:1.8rem 2rem;background:#F6F1E7;border:1px solid #e5dcc8;border-radius:12px;text-align:center}
.smp-sc h3{font-family:Georgia,serif;color:#16263F;font-size:2rem;margin:0 0 .4rem}
.smp-sc-sub{color:#64748b;font-size:1.35rem;margin:0 0 1.2rem}
.smp-sc-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:1.2rem}
.smp-sc-row b{color:#16263F;font-size:1.5rem}
.smp-sc-btn{width:40px;height:40px;border-radius:999px;border:2px solid #16263F;background:#fff;color:#16263F;font-size:1.8rem;font-weight:700;cursor:pointer;line-height:1}
.smp-sc-num{width:70px;text-align:center;font-size:1.7rem;font-weight:700;color:#16263F;border:1.5px solid #d8dee8;border-radius:8px;padding:6px 4px}
.smp-sc-list{margin:0;padding:0;list-style:none}
.smp-sc-list li{display:flex;justify-content:space-between;gap:14px;padding:.55rem 0;border-bottom:1px dotted #d8d0bc;font-size:1.42rem;color:#3a4658}
.smp-sc-list li span:last-child{white-space:nowrap;font-weight:600;color:#16263F}
.smp-sc-note{font-size:1.15rem;color:#8a94a6;margin:1.1rem 0 0;line-height:1.5}
.smp-sc-saletag{color:#b23b2e;font-weight:700;font-size:1.1rem;text-transform:uppercase;margin-left:6px}
.smp-ct{margin:2.8rem 0 2.4rem;padding:1.8rem 2rem;background:#F6F1E7;border:1px solid #e5dcc8;border-radius:12px}
.smp-ct h2{margin:0 0 .8rem}
.smp-ct-why{margin:0 0 1.4rem}
.smp-ct-list{margin-top:.4rem}
.smp-ct-btns{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 1.2rem}
.smp-ct-btn{flex:1 1 auto;min-width:110px;padding:.7rem .9rem;border-radius:999px;border:2px solid #16263F;background:#fff;color:#16263F;font-size:1.32rem;font-weight:700;cursor:pointer;line-height:1.2}
.smp-ct-btn.on{background:#16263F;color:#fff}
.smp-ct-sub{color:#4a5568;font-size:1.3rem;margin:0 0 1rem;line-height:1.55}
.smp-ct-sub b{color:#16263F}
.smp-ct-list{margin:0;padding:0;list-style:none}
.smp-ct-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:.6rem 0;border-bottom:1px dotted #d8d0bc;font-size:1.38rem;color:#3a4658;flex-wrap:wrap}
.smp-ct-list li.smp-ct-off{opacity:.45}
.smp-ct-list li.smp-ct-off .smp-ct-r b{text-decoration:line-through}
.smp-ct-ck{display:flex;align-items:center;gap:9px;cursor:pointer;margin:0}
.smp-ct-ck input{width:19px;height:19px;accent-color:#16263F;cursor:pointer;margin:0;flex:none}
.smp-ct-r{text-align:right}
.smp-ct-qty{color:#8a94a6;font-size:1.2rem;margin-right:6px}
.smp-ct-r a{color:#8a6d1f;font-weight:600;text-decoration:underline;font-size:1.22rem;white-space:nowrap}
.smp-cp-un{color:#8a94a6;font-size:1.18rem;font-style:italic}
.smp-cp-tot{color:#0c5c3b;font-size:1.42rem}
.smp-sc-lp{white-space:nowrap;font-weight:700;color:#0c5c3b;font-size:1.24rem}
.smp-cp-total{border-top:2px solid #16263F !important;border-bottom:none !important;padding-top:.9rem !important;margin-top:.3rem}
@media (max-width:480px){.smp-sc,.smp-ct{padding:1.4rem 1.2rem}.smp-ct-btn{min-width:100%;flex:1 1 100%}.smp-ct-list li{flex-direction:column;align-items:flex-start;gap:4px}.smp-ct-r{text-align:left}}</style>
<script>
(function(){
if(window.__smpScaler2)return; window.__smpScaler2=1;
// live price feed (Cloudflare). Fetched once per page; everyday package prices show instantly if slow/down.
var SMPFEED='https://smp-feed.ancient-snow-93df.workers.dev/smp-feed.json',smpFeedP=null,feedData=null;
function smpGetFeed(){ if(!smpFeedP){ smpFeedP=fetch(SMPFEED).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); } return smpFeedP; }
function fmtQty(v){ if(v>=10)return String(Math.round(v)); if(v>=1){var r=Math.round(v*4)/4; return (r%1===0)?String(r):r.toFixed(2).replace(/\.?0+$/,'');} return String(Math.round(v*100)/100); }
function scaleBuy(buy,f){ return buy.replace(/\d+(?:\.\d+)?/g,function(m){ return fmtQty(parseFloat(m)*f); }); }
function esc(s){ var d=document.createElement('span'); d.textContent=s; return d.innerHTML; }
function money(v){ return '$'+v.toFixed(2); }
function init(box){
  var data=JSON.parse(box.querySelector('.smp-sc-data').textContent);
  var num=box.querySelector('.smp-sc-num');
  var ct=document.querySelector('.smp-ct');
  var ingUl=document.querySelector('.smp-ing');   // the Ingredients section list - rewritten in place when servings change
  var removed={}, tab='custom';
  function nServ(){ return Math.max(2,Math.min(42,parseInt(num.value)||data.base)); }
  // WHOLE-PACKAGE MODEL: you cannot buy 7.5 tbsp of vinegar. Packages needed = ceil of what the batch
  // uses over the package size, never less than one. Every tab prices whole packages; only the price
  // source differs (everyday shelf price vs this week's cheapest verified store).
  function pkgs(it,nn){ return Math.max(1,Math.ceil(it.grams*(nn/data.base)/it.pkg_g)); }
  function pkgLabel(it,k){ if(it.pkg_l==='lb'){return k+' lb';} if(it.pkg_l==='head'){return k+(k>1?' heads':' head');} if(k===1){return '1 '+it.pkg_l;} return k+' × '+it.pkg_l; }
  function price(it,nn,basis){
    var k=pkgs(it,nn), ev=k*it.pkg_p;
    if(basis==='everyday'){ return {cost:ev,live:false,k:k}; }
    var e=(feedData&&feedData.ingredients&&it.bid)?feedData.ingredients[it.bid]:null;
    if(e&&e.cheapest>0&&it.gpu>0){ return {cost:k*(it.pkg_g/it.gpu)*e.cheapest,live:true,k:k,store:e.store,url:e.url,unit:e.unit,up:e.cheapest,sale:e.type==='sale',cn:e.n}; }
    return {cost:ev,live:false,k:k,fallback:true};
  }
  function renderIngredients(){
    // No duplicate list in the scaler box: the recipe's own Ingredients section IS the scaled view.
    if(!ingUl) return;
    var nn=nServ(), f=nn/data.base, html='';
    data.ing.forEach(function(it){ html+='<li><strong>'+esc(it.disp||it.item)+':</strong> '+scaleBuy(it.buy,f)+(it.grams?' ('+Math.round(it.grams*f)+' g)':'')+'</li>'; });
    ingUl.innerHTML=html;
  }
  function renderTabs(){
    if(!ct) return;
    var nn=nServ(), html='', tot=0;
    var basis=(tab==='everyday')?'everyday':'cheapest';
    data.ing.forEach(function(it,i){
      var p=price(it,nn,basis);
      var inc=!(tab==='custom'&&removed[i]);
      if(inc){ tot+=p.cost; }
      var left, right, qty='<span class="smp-ct-qty">'+pkgLabel(it,p.k)+'</span> ';
      if(tab==='custom'){ left='<label class="smp-ct-ck"><input type="checkbox" data-i="'+i+'"'+(inc?' checked':'')+'> <span>'+esc(it.item)+(p.sale?'<span class="smp-sc-saletag">sale</span>':'')+'</span></label>'; }
      else{ left='<span>'+esc(it.item)+(p.sale?'<span class="smp-sc-saletag">sale</span>':'')+'</span>'; }
      if(tab==='cheapest'&&p.live){
        var covN=(p.cn>0&&p.cn<6)?(' <span class="smp-cp-un">(checked at '+p.cn+' of 6 stores)</span>'):'';
        var link=p.url?(' <a href="'+esc(p.url)+'" target="_blank" rel="nofollow noopener">See item &rarr;</a>'):'';
        right=qty+'<b class="smp-cp-tot">'+money(p.cost)+'</b> <span class="smp-sc-lp">'+money(p.up)+'/'+p.unit+' at '+esc(p.store)+'</span>'+covN+link;
      } else if(tab==='cheapest'){
        right=qty+'<b class="smp-cp-tot">'+money(p.cost)+'</b> <span class="smp-cp-un">everyday price (no live price this week)</span>';
      } else if(tab==='custom'&&p.live){
        right=qty+'<b class="smp-cp-tot">'+money(p.cost)+'</b> <span class="smp-cp-un">at '+esc(p.store)+'</span>';
      } else {
        right=qty+'<b class="smp-cp-tot">'+money(p.cost)+'</b>';
      }
      html+='<li'+((tab==='custom'&&!inc)?' class="smp-ct-off"':'')+'>'+left+'<span class="smp-ct-r">'+right+'</span></li>';
    });
    var lbl = (tab==='custom')?'Your shopping total':((tab==='everyday')?'Everyday register total':'Register total at the cheapest stores');
    html+='<li class="smp-cp-total"><span><b>'+lbl+', '+nn+' servings</b></span><span class="smp-ct-r"><b class="smp-cp-tot">'+money(tot)+'</b> <span class="smp-cp-un">about '+money(nn>0?tot/nn:0)+' a serving</span></span></li>';
    ct.querySelector('.smp-ct-list').innerHTML=html;
    var sub=ct.querySelector('.smp-ct-sub');
    if(sub){
      if(tab==='custom'){ sub.innerHTML='Your real register trip. Every ingredient is priced as the <b>whole package</b> you would buy, at this week&rsquo;s cheapest verified store (everyday price where we don&rsquo;t have a live one). <b>Already have something at home? Uncheck it</b> and the total becomes what you still need to spend.'; }
      else if(tab==='everyday'){ sub.innerHTML='Typical Omaha shelf prices on a normal week, whole packages, no sales. This is the number to beat.'; }
      else { sub.innerHTML='This week&rsquo;s cheapest verified price for each package across the stores we track. Links go to the exact item.'; }
    }
    ct.querySelectorAll('.smp-ct-ck input').forEach(function(cb){ cb.addEventListener('change',function(){ removed[cb.getAttribute('data-i')]=!cb.checked; renderTabs(); }); });
  }
  function updateStats(){
    // The blue stat rectangle follows the scaler: servings shows the chosen count, and per-serving
    // is the current-cheapest whole-package total at that count (everyday fallback pre-feed/untracked).
    try{
      var bar=document.querySelector('.mts-recipe-stats'); if(!bar) return;
      var nn=nServ(), t=0;
      data.ing.forEach(function(it){ t+=price(it,nn,'cheapest').cost; });
      bar.querySelectorAll('.stat').forEach(function(s){
        var lEl=s.querySelector('.lbl'), b=s.querySelector('b');
        if(!lEl||!b) return;
        var l=lEl.textContent.trim();
        if(/per serving/i.test(l) && t>0){ b.textContent='$'+(t/nn).toFixed(2); }
        else if(/^servings$/i.test(l)){ b.textContent=String(nn); }
      });
    }catch(e){}
    // The bold "Makes N servings ... per serving (at everyday cost)" line and the Portion It
    // "divide by N" instruction follow the scaler too (idempotent regex rewrites of the numbers).
    try{
      var nn2=nServ(), tev=0;
      data.ing.forEach(function(it){ tev+=price(it,nn2,'everyday').cost; });
      var stat=document.querySelector('.smp-stat');
      if(stat){ stat.innerHTML=stat.innerHTML
        .replace(/Makes \d+ servings/,'Makes '+nn2+' servings')
        .replace(/~\$\d+(?:\.\d+)? per serving/,'~$'+(tev/nn2).toFixed(2)+' per serving'); }
      var por=document.querySelector('.smp-portion');
      if(por){ por.innerHTML=por.innerHTML.replace(/divide by \d+/,'divide by '+nn2); }
    }catch(e){}
  }
  function renderAll(){ renderIngredients(); renderTabs(); updateStats(); }
  box.querySelectorAll('.smp-sc-btn').forEach(function(b){ b.addEventListener('click',function(){ num.value=(parseInt(num.value)||data.base)+parseInt(b.getAttribute('data-d')); renderAll(); }); });
  num.addEventListener('change',renderAll);
  if(ct){ ct.querySelectorAll('.smp-ct-btn').forEach(function(b){ b.addEventListener('click',function(){ tab=b.getAttribute('data-t'); ct.querySelectorAll('.smp-ct-btn').forEach(function(x){ x.classList.toggle('on',x===b); }); renderTabs(); }); }); }
  renderAll();
  smpGetFeed().then(function(f){ feedData=f; renderTabs(); updateStats(); });
}
function go(){ document.querySelectorAll('.smp-sc').forEach(init); }
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',go); } else { go(); }
})();
</script><div class="smp-sc"><h3>Make it your size</h3><p class="smp-sc-sub">Enter the # of servings and the recipe adapts.</p><div class="smp-sc-row"><b>Servings:</b><button type="button" class="smp-sc-btn" data-d="-1">&minus;</button><input class="smp-sc-num" type="number" min="2" max="42" value="14"><button type="button" class="smp-sc-btn" data-d="1">+</button></div><p class="smp-sc-note">The ingredient list and every cost below update as you change it. Per-serving macros do not change when you scale.</p><script type="application/json" class="smp-sc-data">
